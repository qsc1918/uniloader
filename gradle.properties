# =============================================================================
# UniLoader 版本矩阵（T0.2）
#
# 工程纪律第 4 条：禁止硬编码 Minecraft 版本号、库列表、Forge/NeoForge 小版本。
# 本文件是全仓库唯一的版本真源；改这里即可改全链路。Java 代码中不得出现版本字面量。
# =============================================================================

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# IntelliJ 与 configuration cache 尚不兼容（同 fabric-loader 上游设置）
org.gradle.configuration-cache=false

# -----------------------------------------------------------------------------
# 一、项目自身
# -----------------------------------------------------------------------------
group = org.uniloader
description = Unified Minecraft mod loader: Fabric kernel, four ecosystems
url = https://github.com/uniloader/uniloader
ul_version = 0.1.0

# -----------------------------------------------------------------------------
# 二、Minecraft 与 Java
#
# 目标 MC 版本 26.3：与工作区内 NeoForge / MinecraftForge / fabric-api 的目标一致
# （NeoForge/gradle.properties: minecraft_version=26.3；fabric-api: minecraft_version=26.3）。
# Java 25：与 NeoForge/Forge 对齐（两者 java_version=25）。构建下限 21（同 fabric-loader）。
# -----------------------------------------------------------------------------
minecraft_version = 26.3
java_version = 25
java_minimum_build_version = 21
java_loader_release_version = 8

# -----------------------------------------------------------------------------
# 三、内核（fabric-loader fork）依赖
# -----------------------------------------------------------------------------
asm_version = 9.10.1
mixin_version = 0.17.4+mixin.0.8.7
mixin_extras_version = 0.5.5
tiny_remapper_version = 0.14.1
mapping_io_version = 0.9.1
class_tweaker_version = 0.3.0
sat4j_core_version = 2.3.6
sat4j_pb_version = 2.3.6
gradle_wrapper_version = 9.1.0

# -----------------------------------------------------------------------------
# 四、Fabric / Quilt 侧
# -----------------------------------------------------------------------------
fabric_loader_baseline_version = 0.19.5
fabric_api_version = 0.162.0+26.3
loom_version = 1.11-SNAPSHOT
quilt_loader_version = 0.31.0-beta.4
quilt_mappings_version = 26.3+build.1

# -----------------------------------------------------------------------------
# 五、NeoForge 侧（LGPL-2.1-only）
# -----------------------------------------------------------------------------
neoforge_version = 26.3
neoform_version = 1
neoforge_bus_version = 8.0.5
fancymodloader_version = 12.0.8
moddevgradle_plugin_version = 2.0.142

# -----------------------------------------------------------------------------
# 六、Forge 侧（LGPL-2.1-only）
# -----------------------------------------------------------------------------
forge_version = 26.3
forge_eventbus_version = 8.0.5
forge_installer_version = 3.0.+

# -----------------------------------------------------------------------------
# 七、工具链依赖
# -----------------------------------------------------------------------------
night_config_version = 3.8.1
junit_jupiter_version = 5.9.2
slf4j_version = 1.8.0-beta4
log4j_version = 2.8.1

# -----------------------------------------------------------------------------
# 八、实验与验收（T0.3 / T0.4 / T0.6）
#
# d1_experiment_mc_version：D1 实验取映射用的 MC 版本。
#   为什么是 1.21.11 而不是 26.3：**MC 26.1 起 Mojang 不再混淆**，官方版本 json 里
#   已经没有 client_mappings（实测 26.3 / 26.4-snapshot-3 的 downloads 只有 client/server），
#   因此 26.3 上根本不存在「intermediary → named」这条链可测——这不是缺口，是正常状态。
#   1.21.11 是最后一个混淆版（downloads 带 client_mappings/server_mappings），
#   只有它才能验证重映射机制。详见 docs/stage0/T0.2-version-matrix.md 第 2 节。
# -----------------------------------------------------------------------------
d1_experiment_mc_version = 1.21.11
